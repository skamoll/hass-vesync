[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-vesync"
version = "0.1.0"
description = "Home Assistant custom integration for VeSync devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "py-vesync @ git+https://github.com/skamoll/py-vesync.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
